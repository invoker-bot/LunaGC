// Verified against the supplied 7.1.0 client; see docs/CRUCIBLE_PROTOCOL.md.
syntax = "proto3";
option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GadgetPlayStopNotifyOuterClass";

import "GadgetPlayUidInfo.proto";

message GadgetPlayStopNotify {
  uint32 cost_time = 1;
  repeated GadgetPlayUidInfo uid_info_list = 2;
  uint32 entity_id = 4;
  bool is_success = 10;
  uint32 score = 11;
  uint32 play_type = 12;
}
