// Fields used by MP_PLAY, recovered from the supplied 7.1 native client; see docs/CRUCIBLE_PROTOCOL.md.
syntax = "proto3";
import "MatchType.proto";
option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerConfirmMatchRspOuterClass";
message PlayerConfirmMatchRsp {
  recovered.p_MatchType.MatchType match_type = 5;
  uint32 match_id = 6;
  bool is_agreed = 9;
  int32 retcode = 13;
}
