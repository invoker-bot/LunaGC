// Fields used by MP_PLAY, recovered from the supplied 7.1 native client; see docs/CRUCIBLE_PROTOCOL.md.
syntax = "proto3";
import "MatchType.proto";
option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerMatchAgreedResultNotifyOuterClass";
message PlayerMatchAgreedResultNotify {
  uint32 reason = 9;
  uint32 target_uid = 10;
  recovered.p_MatchType.MatchType match_type = 15;
}
