// Fields used by MP_PLAY, recovered from the supplied 7.1 native client; see docs/CRUCIBLE_PROTOCOL.md.
syntax = "proto3";
import "MatchType.proto";
option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerStartMatchRspOuterClass";
message PlayerStartMatchRsp {
  int32 retcode = 3;
  recovered.p_MatchType.MatchType match_type = 4;
  uint32 dungeon_id = 8;
  uint32 match_id = 11;
  uint32 mp_play_id = 15;
}
