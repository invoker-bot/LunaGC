// Fields used by MP_PLAY, recovered from the supplied 7.1 native client; see docs/CRUCIBLE_PROTOCOL.md.
syntax = "proto3";
import "MatchType.proto";
option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerGuestConfirmMatchRspOuterClass";
message PlayerGuestConfirmMatchRsp {
  uint32 match_id = 1;
  bool is_agreed = 4;
  int32 retcode = 7;
  recovered.p_MatchType.MatchType match_type = 11;
}
