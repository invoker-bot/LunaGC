// Fields used by MP_PLAY, recovered from the supplied 7.1 native client; see docs/CRUCIBLE_PROTOCOL.md.
syntax = "proto3";
import "MatchType.proto";
option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerMatchInfoNotifyOuterClass";
message PlayerMatchInfoNotify {
  uint32 match_id = 1;
  uint32 mp_play_id = 2;
  recovered.p_MatchType.MatchType match_type = 3;
  uint32 host_uid = 6;
  repeated uint32 match_param_list = 8;
  uint32 dungeon_id = 12;
}
