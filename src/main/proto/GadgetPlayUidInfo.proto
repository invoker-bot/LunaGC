// Verified against the supplied 7.1.0 client; see docs/CRUCIBLE_PROTOCOL.md.
syntax = "proto3";
option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GadgetPlayUidInfoOuterClass";

import "ProfilePicture.proto";

message GadgetPlayUidInfo {
  uint32 icon = 2;
  uint32 uid = 3;
  ProfilePicture profile_picture = 5;
  uint32 score = 7;
  uint32 op = 9;
  string online_id = 10;
  string nickname = 11;
}
