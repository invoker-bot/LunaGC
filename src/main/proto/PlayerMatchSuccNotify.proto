// Fields used by MP_PLAY, recovered from the supplied 7.1 native client; see docs/CRUCIBLE_PROTOCOL.md.
syntax = "proto3";
import "MatchType.proto";
option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerMatchSuccNotifyOuterClass";
message PlayerMatchSuccNotify {
  recovered.p_MatchType.MatchType match_type = 1;
  uint32 mp_play_id = 4;
  uint32 confirm_end_time = 6;
  uint32 host_uid = 10;
  uint32 dungeon_id = 13;
}
