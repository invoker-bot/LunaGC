<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LunaGC 公告</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee8da;color:#34302a;font:16px/1.6 system-ui,sans-serif}header{padding:16px 24px;border-bottom:1px solid #c6b993;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:23px}button{cursor:pointer;color:inherit;background:#fff9eb;border:1px solid #b8ab8a;border-radius:5px;padding:8px 14px;font:inherit}main{display:grid;grid-template-columns:260px 1fr;max-width:1200px;margin:auto;min-height:65vh}nav{padding:16px;border-right:1px solid #c6b993}nav button{display:block;width:100%;margin:8px 0;text-align:left}nav button[aria-current=true]{background:#d5be82}article{padding:24px 32px}h2{font-size:22px;margin:0 0 8px}#content{white-space:pre-wrap;overflow-wrap:anywhere}#status{padding:10px 24px;margin:0}#date{color:#756d5f;font-size:13px}a{color:#67511e}@media(max-width:600px){main{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid #c6b993}article{padding:20px}header{padding:12px}nav button{margin:4px 0}}
</style></head><body><header><h1>LunaGC 公告</h1><button id="refresh">刷新公告</button></header><p id="status" role="status" aria-live="polite">正在获取公告…</p><main><nav id="list" aria-label="公告列表"></nav><article><h2 id="title">公告</h2><p id="date"></p><div id="content"></div></article></main>
<script>
(function(){
var list=document.getElementById('list'), status=document.getElementById('status'), refresh=document.getElementById('refresh');
function load(){
 refresh.disabled=true;status.textContent='正在获取公告…';
 var controller=new AbortController(), timer=setTimeout(function(){controller.abort();},8000);
 fetch('/common/hk4e_cn/announcement/api/getAnnList',{cache:'no-store',signal:controller.signal}).then(function(r){if(!r.ok)throw Error('获取失败');return r.json();}).then(function(data){
  if(data.retcode!==0)throw Error(data.message||'获取失败');
  list.textContent='';var rows=[];data.data.list.forEach(function(group){group.list.forEach(function(n){rows.push(n);});});
  status.textContent=rows.length?'共 '+rows.length+' 条公告':'暂无已发布的公告。';
  document.getElementById('title').textContent='公告';document.getElementById('content').textContent='';document.getElementById('date').textContent='';
  rows.forEach(function(n,index){var button=document.createElement('button');button.textContent=n.title;button.onclick=function(){
   Array.prototype.forEach.call(list.children,function(b){b.setAttribute('aria-current',String(b===button));});
   document.getElementById('title').textContent=n.title;
   document.getElementById('date').textContent=Number(n.start_time)>0?new Date(Number(n.start_time)*1000).toLocaleString():'';
   var box=document.createElement('div');box.innerHTML=n.content.replace(/<br\s*\/?\s*>/gi,'\n');
   document.getElementById('content').textContent=box.textContent;
  };list.appendChild(button);if(index===0)button.click();});
 }).catch(function(){status.textContent='暂时无法获取公告，请点击刷新重试。';}).finally(function(){clearTimeout(timer);refresh.disabled=false;});
}
refresh.onclick=load;load();
})();
</script></body></html>
