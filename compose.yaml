name: lunagc

services:
  mongo:
    image: ${LUNAGC_MONGO_IMAGE:-mongo:7.0}
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GRADLE_IMAGE: ${LUNAGC_GRADLE_IMAGE:-gradle:8.5.0-jdk17}
        JRE_IMAGE: ${LUNAGC_JRE_IMAGE:-eclipse-temurin:17-jre}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      LUNAGC_MONGO_URI: mongodb://mongo:27017
      LUNAGC_PUBLIC_ADDRESS: ${LUNAGC_PUBLIC_ADDRESS:-127.0.0.1}
      LUNAGC_RESOURCES_DIR: /opt/lunagc/resources
    ports:
      - "127.0.0.1:${LUNAGC_GM_HTTP_PORT:-80}:8088/tcp"
      - "8088:8088/tcp"
      - "22101:22101/udp"
    volumes:
      - lunagc-state:/var/lib/lunagc
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8088'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    stop_grace_period: 30s

volumes:
  mongo-data:
  lunagc-state:
